<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="diceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97D55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C46A4A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#F4E9D7"/>
  
  <!-- Dice Body -->
  <rect x="25" y="25" width="50" height="50" rx="10" fill="url(#diceGradient)" filter="url(#shadow)"/>
  
  <!-- Dice Dots -->
  <circle cx="35" cy="35" r="4" fill="white"/>
  <circle cx="65" cy="35" r="4" fill="white"/>
  <circle cx="35" cy="65" r="4" fill="white"/>
  <circle cx="65" cy="65" r="4" fill="white"/>
  <circle cx="50" cy="50" r="4" fill="white"/>
  
  <!-- Sparkle -->
  <path d="M75 20 L77 25 L82 25 L78 28 L80 33 L75 30 L70 33 L72 28 L68 25 L73 25 Z" fill="#6FA4AF" opacity="0.8"/>
</svg>
