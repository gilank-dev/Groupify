<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplikasi Pengocok Kelompok Nama - Ringan dan Cepat">
    <meta name="theme-color" content="#D97D55">
    <title>🎲 Groupify - Pengocok Kelompok</title>
    <link rel="canonical" href="https://groupify.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://groupify.vercel.app/">
    <meta property="og:title" content="Groupify — Pengocok Kelompok Nama">
    <meta property="og:description" content="Aplikasi pengocok kelompok nama yang ringan dan cepat. Gratis, tanpa iklan, jalan langsung di browser.">
    <meta property="og:locale" content="id_ID">
    <meta property="og:site_name" content="Groupify">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Groupify — Pengocok Kelompok Nama">
    <meta name="twitter:description" content="Aplikasi pengocok kelompok nama yang ringan dan cepat. Gratis, tanpa iklan.">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://groupify.vercel.app/#website",
          "url": "https://groupify.vercel.app/",
          "name": "Groupify",
          "inLanguage": "id-ID"
        },
        {
          "@type": "WebApplication",
          "name": "Groupify",
          "url": "https://groupify.vercel.app/",
          "applicationCategory": "UtilityApplication",
          "operatingSystem": "Any (Web Browser)",
          "inLanguage": "id-ID",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
          "description": "Aplikasi pengocok kelompok nama yang ringan dan cepat. Gratis, tanpa iklan, jalan langsung di browser."
        }
      ]
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p class="loading-text">Memuat...</p>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎲</span>
                <h1 class="logo-title">Groupify</h1>
            </div>
            <nav class="header-nav">
                <button class="btn-icon" id="themeToggle" aria-label="Toggle theme">
                    <span class="icon">🌙</span>
                </button>
                <button class="btn-icon" id="historyBtn" aria-label="History">
                    <span class="icon">📜</span>
                </button>
            </nav>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <!-- Input Section -->
            <section class="input-section glass-card">
                <h2 class="section-title">
                    <span class="icon">📝</span>
                    Input Data
                </h2>

                <div class="input-grid">
                    <div class="input-group">
                        <label for="namesInput" class="input-label">
                            <span class="label-icon">👥</span>
                            Daftar Nama
                            <span class="label-hint">Satu nama per baris</span>
                        </label>
                        <textarea id="namesInput" class="input-textarea" placeholder="Masukkan nama peserta...&#10;Contoh:&#10;Ahmad&#10;Budi&#10;Citra"></textarea>
                        <div class="input-footer">
                            <span class="char-count" id="charCount">0 nama</span>
                            <button class="btn-icon-sm" id="pasteBtn" title="Paste">📋</button>
                        </div>
                    </div>

                    <div class="input-sidebar">
                        <div class="input-group">
                            <label for="groupCount" class="input-label">
                                <span class="label-icon">🔢</span>
                                Jumlah Kelompok
                            </label>
                            <div class="input-with-stepper">
                                <button class="stepper-btn" id="decreaseGroups">-</button>
                                <input type="number" id="groupCount" class="input-number" min="2" max="50" value="4">
                                <button class="stepper-btn" id="increaseGroups">+</button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="shuffleMode" class="input-label">
                                <span class="label-icon">🎯</span>
                                Mode
                            </label>
                            <select id="shuffleMode" class="input-select">
                                <option value="balanced">Balanced (Adil)</option>
                                <option value="random">Random (Acak)</option>
                            </select>
                        </div>

                        <div class="toggle-group">
                            <label class="toggle-label">
                                <span>🔊 Sound</span>
                                <input type="checkbox" id="soundToggle" checked>
                                <span class="toggle-slider"></span>
                            </label>
                            <label class="toggle-label">
                                <span>🎊 Effects</span>
                                <input type="checkbox" id="emojiToggle" checked>
                                <span class="toggle-slider"></span>
                            </label>
                            <label class="toggle-label">
                                <span>💾 Auto Save</span>
                                <input type="checkbox" id="autoSaveToggle" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="action-section">
                <div class="button-group">
                    <button class="btn btn-primary btn-lg" id="shuffleBtn">
                        <span class="btn-icon">🎲</span>
                        <span class="btn-text">Kocok!</span>
                    </button>
                    <button class="btn btn-secondary btn-lg" id="exportBtn" disabled>
                        <span class="btn-icon">📥</span>
                        <span class="btn-text">CSV</span>
                    </button>
                    <button class="btn btn-secondary btn-lg" id="exportPdfBtn" disabled>
                        <span class="btn-icon">📄</span>
                        <span class="btn-text">PDF</span>
                    </button>
                    <button class="btn btn-danger btn-lg" id="clearBtn">
                        <span class="btn-icon">🗑️</span>
                        <span class="btn-text">Reset</span>
                    </button>
                </div>
                <div class="section-actions" style="justify-content:center;margin-top:12px;">
                    <button class="btn btn-sm btn-outline" id="sampleDataBtn">📋 Sample</button>
                    <button class="btn btn-sm btn-outline" id="importBtn">📤 Import</button>
                </div>
            </section>

            <!-- Dice Overlay -->
            <div class="dice-overlay" id="diceOverlay" aria-hidden="true">
                <div class="dice-container">
                    <div class="dice" id="dice">
                        <div class="dice-face dice-front">🎲</div>
                        <div class="dice-face dice-back">⭐</div>
                        <div class="dice-face dice-right">🎯</div>
                        <div class="dice-face dice-left">🔥</div>
                        <div class="dice-face dice-top">✨</div>
                        <div class="dice-face dice-bottom">🎊</div>
                    </div>
                </div>
                <div class="dice-progress"><div class="progress-bar" id="diceProgress"></div></div>
                <p class="dice-text" id="diceText">Mengocok...</p>
            </div>

            <!-- Effects -->
            <div class="emoji-container" id="emojiContainer"></div>
            <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

            <!-- Quote -->
            <section class="quote-section glass-card" id="quoteSection" hidden>
                <span class="quote-icon">💡</span>
                <blockquote class="quote-text" id="quoteText"></blockquote>
                <cite class="quote-author" id="quoteAuthor"></cite>
            </section>

            <!-- Results -->
            <section class="results-section" id="resultsSection" hidden>
                <div class="results-header">
                    <h2 class="results-title">
                        <span class="icon">✨</span>
                        Hasil Kelompok
                    </h2>
                    <div class="results-actions">
                        <button class="btn btn-sm btn-outline" id="copyResultsBtn">📋 Copy</button>
                        <button class="btn btn-sm btn-outline" id="printResultsBtn">🖨️ Print</button>
                    </div>
                </div>

                <div class="stats-bar" id="statsBar">
                    <div class="stat-card">
                        <div class="stat-icon">📊</div>
                        <div class="stat-info">
                            <span class="stat-value" id="totalGroups">0</span>
                            <span class="stat-label">Kelompok</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-info">
                            <span class="stat-value" id="totalMembers">0</span>
                            <span class="stat-label">Anggota</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📈</div>
                        <div class="stat-info">
                            <span class="stat-value" id="avgMembers">0</span>
                            <span class="stat-label">Rata-rata</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⚖️</div>
                        <div class="stat-info">
                            <span class="stat-value" id="distribution">0</span>
                            <span class="stat-label">Selisih</span>
                        </div>
                    </div>
                </div>

                <div class="results-grid" id="resultsGrid"></div>
            </section>
        </main>

        <!-- History Panel -->
        <aside class="history-panel" id="historyPanel" hidden>
            <div class="panel-header">
                <h3>📜 Riwayat</h3>
                <button class="btn-icon-sm" id="closeHistoryBtn">✕</button>
            </div>
            <div class="panel-content" id="historyContent"></div>
            <div class="panel-footer">
                <button class="btn btn-sm btn-danger" id="clearHistoryBtn">🗑️ Clear All</button>
            </div>
        </aside>

        <!-- Footer -->
        <footer class="footer">
        </footer>

        <!-- Toast -->
        <div class="toast-container" id="toastContainer"></div>
    </div>

    <!-- App Script -->
    <script src="src/app.js"></script>
</body>
</html>
